<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#162F55">
  <title>الگو هاب — اتصال برقرار نیست</title>
  <style>
    @font-face{font-family:Vazirmatn;src:url('/static/fonts/Vazirmatn-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
    @font-face{font-family:Vazirmatn;src:url('/static/fonts/Vazirmatn-ExtraBold.woff2') format('woff2');font-weight:800;font-display:swap}
    *,*::before,*::after{font-family:Vazirmatn,Tahoma,system-ui,sans-serif!important;font-synthesis:none}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0A1622;color:#E6EEF7;
      text-align:center;padding:24px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    .box{max-width:420px}
    h1{font-size:22px;margin:16px 0 8px}
    p{color:#8AA0B8;font-size:14px;line-height:2}
    a{display:inline-block;margin-top:18px;padding:10px 22px;border-radius:14px;text-decoration:none;
      font-weight:800;color:#04201d;background:linear-gradient(135deg,#4ED9CC,#19C3B3 45%,#128F84)}
  </style>
</head>
<body>
  <div class="box">
    <div style="font-size:52px">📡</div>
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>الگو هاب به شبکه دسترسی ندارد. پس از وصل‌شدن، دوباره تلاش کنید.</p>
    <a href="/">تلاش دوباره</a>
  </div>
</body>
</html>
